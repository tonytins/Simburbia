name: Swift

# Builds and tests the Simburbia packages: the client at the root, and the
# libraries and tools beside it. Each package is independent, so each one
# builds and tests on its own, as AGENTS.md's "Before you finish" asks.
# Real-install tests skip themselves here: CI has no TSO_GAME_DIR, and no
# game data may be stored in the repository. Tests that need an install run
# on MockInstall, a made-up one, instead.

on:
  push:
    branches: [ "main" ]
    paths:
      - "TSOFiles/**"
      - "TSOFilesC/**"
      - "TSOFilesCheck/**"
      - "TSOContent/**"
      - "SimAntics/**"
      - "SimsScript/**"
      - "SBOracle/**"
      - "ScriptOracle/**"
      - "Client/**"
      - "Package.swift"
      - "Package.resolved"
      - "MockInstall/**"
      - "Lots/**"
      - "Interface/**"
      - "Tuning/**"
      - "packaging/**"
      - "scripts/**"
      - "GitVersion.txt"
      - ".github/workflows/swift.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "TSOFiles/**"
      - "TSOFilesC/**"
      - "TSOFilesCheck/**"
      - "TSOContent/**"
      - "SimAntics/**"
      - "SimsScript/**"
      - "SBOracle/**"
      - "ScriptOracle/**"
      - "Client/**"
      - "Package.swift"
      - "Package.resolved"
      - "MockInstall/**"
      - "Lots/**"
      - "Interface/**"
      - "Tuning/**"
      - "packaging/**"
      - "scripts/**"
      - "GitVersion.txt"
      - ".github/workflows/swift.yml"

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7
        with:
          # The client's version counts commits (GitVersion), which a shallow clone can't.
          fetch-depth: 0

      - name: Install X11 and GL headers for raylib (the client)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev

      - name: Build and test each package
        shell: bash
        run: |
          set -euo pipefail
          # The client is the root package ("."); the libraries and tools are the folders beside it.
          for package in TSOFiles TSOFilesCheck TSOContent SimAntics SimsScript SBOracle ScriptOracle .; do
            echo "::group::${package/#./client}"
            swift build --package-path "$package"
            swift test --package-path "$package"
            echo "::endgroup::"
          done

      - name: Run the SimsScript scenarios on MockInstall
        run: swift run --package-path ScriptOracle sso-oracle run

      - name: Check library sources for trap patterns
        shell: bash
        run: |
          # AGENTS.md "Never crash": no try!, as!, fatalError, or precondition in Sources.
          if grep -rnE 'try!|as!|fatalError|precondition|preconditionFailure' */Sources; then
            echo "::error::Trap patterns found in library sources"
            exit 1
          fi

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The client's version counts commits (GitVersion), which a shallow clone can't.
          fetch-depth: 0

      - name: Show the Swift version
        run: swift --version

      - name: Build and test each package
        shell: bash
        run: |
          set -euo pipefail
          # The client is the root package ("."); the libraries and tools are the folders beside it.
          for package in TSOFiles TSOFilesCheck TSOContent SimAntics SimsScript SBOracle ScriptOracle .; do
            echo "::group::${package/#./client}"
            swift build --package-path "$package"
            swift test --package-path "$package"
            echo "::endgroup::"
          done
